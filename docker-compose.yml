
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: passwordForMySQL8.1
      MYSQL_DATABASE: main_db
    ports:
      - "3307:3306"
    networks:
      - backend
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ppasswordForMySQL8.1" ]
      interval: 10s
      timeout: 5s
      retries: 5
  account-service:
    container_name: account-service
    image: account-service:latest
    build:
      context: ./account-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: development
      SERVER_PORT: 8081
    depends_on:
      - kafka
      - mysql
    networks:
      - backend
    env_file:
      - .env

  transaction-service:
    command:
      - "--grpc.client.fds-service.address=static://fraud-detection-service:9090"
      - "--grpc.client.fds-service.negotiation-type=PLAINTEXT"
    container_name: transaction-service
    image: transaction-service:latest
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: development
      MYSQL_DATABASE: transaction_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      - kafka
      - mysql
    networks:
      - backend
    env_file:
      - .env

  notification-service:
    container_name: notification-service
    image: notification-service:latest
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: development
    depends_on:
      - kafka
      - mysql
    networks:
      - backend
    env_file:
      - .env
  user-service:
    image: user-service:latest
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    networks:
      - backend
    env_file:
      - .env
  fraud-detection-service:
    container_name: fraud-detection-service
    image: fraud-detection-service:latest
    build:
      context: ./fraud-detection-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: development
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      - kafka
      - mysql
    networks:
      - backend
    env_file:
      - .env
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - backend
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - backend

  kafdrop:
    image: obsidiandynamics/kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    depends_on:
      - kafka
    networks:
      - backend

  redis:
    container_name: redis
    image: redis
    ports:
      - "6379:6379"
    networks:
      - backend
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "127.0.0.1:5540:5540"
    networks:
      - backend
    volumes:
      - redisinsight-data:/data

networks:
  backend:
    driver: bridge

volumes:
    redisinsight-data: