<main class="auth-page">
  <section class="auth-card" aria-labelledby="auth-title">
    <a class="brand" routerLink="/auth" aria-label="Account Dashboard login">
      <span class="brand-mark">A</span>
      <span>Account Dashboard</span>
    </a>

    <h1 id="auth-title">{{ mode === 'login' ? '다시 만나 반가워요' : '계정 만들기' }}</h1>
    <p class="subtitle">
      {{ mode === 'login' ? '계정에 로그인해 거래 내역을 확인하세요.' : '안전하게 계정을 만들고 시작하세요.' }}
    </p>

    <div class="auth-tabs" role="tablist" aria-label="인증 방식 선택">
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="mode === 'login'"
        [class.active]="mode === 'login'"
        (click)="setMode('login')">
        로그인
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="mode === 'signup'"
        [class.active]="mode === 'signup'"
        (click)="setMode('signup')">
        회원가입
      </button>
    </div>

    <div *ngIf="successMessage" class="alert alert-success" role="status">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="submit()" #authForm="ngForm">
      <label for="username">아이디</label>
      <input
        id="username"
        name="username"
        type="text"
        [(ngModel)]="username"
        autocomplete="username"
        required
        maxlength="100"
        placeholder="아이디를 입력하세요">

      <label for="password">비밀번호</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        [autocomplete]="mode === 'login' ? 'current-password' : 'new-password'"
        [minlength]="mode === 'signup' ? 6 : 1"
        required
        placeholder="6자 이상 입력하세요">
      <small *ngIf="mode === 'signup'" class="password-hint">비밀번호는 6자 이상이어야 합니다.</small>

      <button class="submit-button" type="submit" [disabled]="authForm.invalid || isSubmitting">
        {{ isSubmitting ? '처리 중...' : (mode === 'login' ? '로그인' : '회원가입') }}
      </button>
    </form>

    <p class="switch-mode">
      {{ mode === 'login' ? '아직 계정이 없으신가요?' : '이미 계정이 있으신가요?' }}
      <button type="button" (click)="setMode(mode === 'login' ? 'signup' : 'login')">
        {{ mode === 'login' ? '회원가입' : '로그인' }}
      </button>
    </p>
  </section>
</main>
