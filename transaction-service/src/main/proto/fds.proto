syntax = "proto3";

package org.example.proto;

option java_package = "org.example.grpc.fds";
option java_multiple_files = true;

service FdsCheckService {
    rpc VerifyTransaction (FdsVerifyRequest) returns (FdsVerifyResponse);
}

message FdsVerifyRequest {
    string user_id = 1;
    int64 from_account_id = 2;
    double amount = 3;

    string transaction_type = 4;
    int64 account_id = 5;
    int64 to_account_id = 6;
}

message FdsVerifyResponse {
    bool allowed = 1;
    string message = 2;
}
